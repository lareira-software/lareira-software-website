name: Publicar web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  calidad:
    name: Revisión de diseño (Impeccable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes impeccable detect index.html

  construir:
    name: Preparar la web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copiar solo lo que se publica
        run: |
          mkdir _site
          cp -r index.html CNAME img fonts _site/
          mkdir -p _site/brief/fonts
          cp brief/index.html brief/app.js brief/model.js brief/style.css _site/brief/
          cp brief/fonts/* _site/brief/fonts/
          sed -i 's#<meta name="brief-endpoint" content="/api/brief">#<meta name="brief-endpoint" content="https://api.lareirasoftware.com/api/brief">#' _site/brief/index.html
          grep -q 'content="https://api.lareirasoftware.com/api/brief"' _site/brief/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
